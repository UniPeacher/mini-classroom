version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    # 仅忽略常规补丁更新，安全修复仍由仓库的安全更新设置控制。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    groups:
      compatible-updates:
        update-types:
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 1
    groups:
      actions-updates:
        patterns:
          - "*"
